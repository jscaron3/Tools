<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tools</title>
  <link rel="stylesheet" href="./style.css" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Outfit", sans-serif;
      /* background:
        radial-gradient(circle at top left, rgba(255, 198, 87, 0.22), transparent 36%),
        radial-gradient(circle at bottom right, rgba(0, 0, 0, 0.06), transparent 28%),
        #f4f4f4; */
      color: #212a37;
    }

    .template-shell {
      min-height: 100vh;
		width: 100%;
		    display: flex;
    flex-direction: column;
      /* padding: 1.5rem; */
    }

    .template-topbar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .template-title {
      margin: 0;
      font-size: clamp(2rem, 3vw, 3.5rem);
      line-height: 1;
    }

    .template-back {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.8rem 1rem;
      border-radius: 999px;
      text-decoration: none;
      color: #fff;
      background: #212a37;
      box-shadow: 0 12px 30px rgba(33, 42, 55, 0.18);
    }

    .tool-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      max-width: 900px;
    }

    .tool-card {
      display: block;
      padding: 1.25rem 1.5rem;
      border-radius: 1rem;
      background: rgba(255, 255, 255, 0.82);
      color: inherit;
      text-decoration: none;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
      backdrop-filter: blur(12px);
    }

    .tool-frame {
      width: 100%;
		display: block;
		position: relative;
    }
  </style>
</head>
<body>
  <div class="template-shell">
    <div class="template-topbar">
      <h1 class="template-title" id="page-title">Tools</h1>
      <a class="template-back" id="tool-back" href="./index.html">Back</a>
    </div>

    <div class="tool-list" id="tool-list"></div>
    <div class="tool-frame" id="tool-mount" hidden></div>
  </div>

  <script type="module" src="./main-script.js"></script>
</body>
</html>
