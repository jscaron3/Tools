<meta name="viewport" content="width=device-width, initial-scale=1">

</head>
<body>
<div class="wrap">

  <div class="dashboard-layout">

  <!-- VULNERABILITIES TAB -->
  <div id="vulnerabilities" class="tab-content active">
    <div class="section-header">
      <h2>
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><g fill="currentColor"><path d="m22.596,17.346L14.697,3.562c-.561-.979-1.569-1.562-2.697-1.562s-2.136.584-2.697,1.562L1.404,17.346c-.558.974-.555,2.134.008,3.104.562.971,1.568,1.55,2.689,1.55h15.798c1.122,0,2.127-.579,2.689-1.55.562-.971.565-2.131.008-3.104Zm-11.596-9.346h2v6h-2v-6Zm1,10c-.689,0-1.25-.561-1.25-1.25s.561-1.25,1.25-1.25,1.25.561,1.25,1.25-.561,1.25-1.25,1.25Z" stroke-width="0" fill="currentColor"></path></g></svg>
      Vulnerabilities</h2>
      <div class="actions-wrap">
        <button id="showVulnFilters" class="btn-action filters-btn" type="button">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><g fill="none"><path d="M4.0001 3H20.0002C20.5525 3 21.0002 3.44764 21.0002 3.99987L21.0004 5.58569C21.0005 5.85097 20.8951 6.10538 20.7075 6.29295L14.293 12.7071C14.1055 12.8946 14.0001 13.149 14.0001 13.4142L14.0001 19.7192C14.0001 20.3698 13.3887 20.8472 12.7576 20.6894L10.7576 20.1894C10.3124 20.0781 10.0001 19.6781 10.0001 19.2192L10.0001 13.4142C10.0001 13.149 9.89474 12.8946 9.7072 12.7071L3.29299 6.29289C3.10545 6.10536 3.0001 5.851 3.0001 5.58579V4C3.0001 3.44772 3.44781 3 4.0001 3Z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></g></svg>
        </button>
        <button id="vulnUpdate" class="btn-action update-btn" type="button"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><g fill="currentColor" stroke-linejoin="miter" stroke-linecap="butt"> <path d="M3.5 2.5V7.5H8.5" stroke="currentColor" stroke-width="2" stroke-linecap="square" fill="none"></path> <path d="M20.5 21.5V16.5H15.5" stroke="currentColor" stroke-width="2" stroke-linecap="square" fill="none"></path> <path d="M2.49996 12C2.49996 17.2467 6.75325 21.5 12 21.5C15.6185 21.5 18.7646 19.4769 20.3687 16.5L20.2157 16.7729" stroke="currentColor" stroke-width="2" stroke-miterlimit="10" stroke-linecap="square" fill="none"></path> <path d="M21.5 12C21.5 6.75329 17.2467 2.5 12 2.5C8.38143 2.5 5.23538 4.52315 3.63131 7.5L3.73595 7.311" stroke="currentColor" stroke-width="2" stroke-miterlimit="10" stroke-linecap="square" fill="none"></path> </g></svg></button>

      </div>
    </div>
    
    <section class="panel filters vulnFilters" aria-label="Vulnerability Filters">
      <div class="row" id="kwRow"><label class="lbl">Products</label></div>
      <div class="row">
        <label class="lbl" for="vulnSev">Severity</label>
        <select id="vulnSev">
          <option value="all">All</option>
          <option value="CRITICAL">Critical</option>
          <option value="HIGH">High and above</option>
          <option value="MEDIUM">Medium and above</option>
        </select>
        <label class="lbl" for="vulnSort" style="min-width:auto;margin-left:8px">Sort</label>
        <select id="vulnSort">
          <option value="date">Newest first</option>
          <option value="score">Highest score first</option>
        </select>
        <input type="search" id="vulnQ" placeholder="Filter by plugin, CVE ID or word">
      </div>
    </section>

    <p class="status" id="vulnStatus" role="status" aria-live="polite"></p>
    <div id="vulnSummary"></div>
    <div id="vulnLog"></div>
    <footer>Data from the NVD API 2.0 (no API key: 5 requests per 30 seconds). Keyword search matches descriptions.</footer>
  </div>

  <!-- CHANGELOG TAB -->
  <div id="changelog" class="tab-content">
      
    <div class="section-header">
      <h2><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><g fill="currentColor"> <path fill-rule="evenodd" clip-rule="evenodd" d="M11.0784 1C10.2828 1 9.51972 1.31607 8.95711 1.87868L3.87868 6.95711C3.31607 7.51972 3 8.28278 3 9.07843V20C3 21.6569 4.34315 23 6 23H18C19.6569 23 21 21.6569 21 20V4C21 2.34315 19.6569 1 18 1H11.0784ZM11 9H5L11 3V9ZM14 7V9H17V7H14ZM7 11H17V13H7V11ZM7 15V17H17V15H7Z" fill="currentColor"></path> </g></svg>Divi Changelog</h2> 
      <div class="actions-wrap">
        <button id="showDiviFilters" class="btn-action filters-btn" type="button">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><g fill="none"><path d="M4.0001 3H20.0002C20.5525 3 21.0002 3.44764 21.0002 3.99987L21.0004 5.58569C21.0005 5.85097 20.8951 6.10538 20.7075 6.29295L14.293 12.7071C14.1055 12.8946 14.0001 13.149 14.0001 13.4142L14.0001 19.7192C14.0001 20.3698 13.3887 20.8472 12.7576 20.6894L10.7576 20.1894C10.3124 20.0781 10.0001 19.6781 10.0001 19.2192L10.0001 13.4142C10.0001 13.149 9.89474 12.8946 9.7072 12.7071L3.29299 6.29289C3.10545 6.10536 3.0001 5.851 3.0001 5.58579V4C3.0001 3.44772 3.44781 3 4.0001 3Z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></g></svg>
        </button>
        <button id="changeRefresh" class="btn-action update-btn" type="button">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><g fill="currentColor" stroke-linejoin="miter" stroke-linecap="butt"> <path d="M3.5 2.5V7.5H8.5" stroke="currentColor" stroke-width="2" stroke-linecap="square" fill="none"></path> <path d="M20.5 21.5V16.5H15.5" stroke="currentColor" stroke-width="2" stroke-linecap="square" fill="none"></path> <path d="M2.49996 12C2.49996 17.2467 6.75325 21.5 12 21.5C15.6185 21.5 18.7646 19.4769 20.3687 16.5L20.2157 16.7729" stroke="currentColor" stroke-width="2" stroke-miterlimit="10" stroke-linecap="square" fill="none"></path> <path d="M21.5 12C21.5 6.75329 17.2467 2.5 12 2.5C8.38143 2.5 5.23538 4.52315 3.63131 7.5L3.73595 7.311" stroke="currentColor" stroke-width="2" stroke-miterlimit="10" stroke-linecap="square" fill="none"></path> </g></svg>
        </button>
        
      </div>
    </div>
    <section class="panel filters diviFilters" aria-label="Changelog Filters">
      <div class="row">
        <label class="lbl" for="changeProduct">Select Product</label>
        <select id="changeProduct">
          <option value="all">Combined</option>
          <option value="divi-4">Divi 4</option>
          <option value="divi-5">Divi 5</option>
        </select>
      </div>
      <div class="row">
        <input type="search" id="changeSearch" placeholder="Search version or release notes">
        <label style="font-size:13px;color:var(--muted)">From <input id="changeFrom" type="date"></label>
        <label style="font-size:13px;color:var(--muted)">To <input id="changeTo" type="date"></label>
      </div>
      <fieldset class="fieldset-compact" id="changeTypes">
        <legend>Change types</legend>
        <label><input type="checkbox" name="type" value="feature" checked> Features</label>
        <label><input type="checkbox" name="type" value="improvement" checked> Improvements</label>
        <label><input type="checkbox" name="type" value="bug" checked> Bug fixes</label>
        <label><input type="checkbox" name="type" value="security" checked> Security</label>
        <button type="button" id="changeReset" style="margin-left:auto">Reset filters</button>
      </fieldset>
    </section>

    <p class="status" id="changeStatus" role="status" aria-live="polite"></p>
    <div id="changeLog" role="region" aria-live="polite"></div>
    <footer>Official changelogs: <a href="https://www.elegantthemes.com/api/changelog/divi.txt" target="_blank" rel="noopener">Divi 4</a> · <a href="https://www.elegantthemes.com/api/changelog/divi-5.txt" target="_blank" rel="noopener">Divi 5</a></footer>
  </div>
</div>

</div>

<script src="./app.js"></script>
</body>
</html>
