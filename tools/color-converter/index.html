<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Type system V4</title>
        <link rel="stylesheet" href="https://public.codepenassets.com/css/normalize-5.0.0.min.css" />
        <link rel="stylesheet" href="./style.css" />
    </head>

    <body>
        <!-- <main :class="darkMode == 'dark' ? 'dark' : ''"> -->
        <main>
            <div class="navigation">
                <div class="toggles">
                    <span class="page-toggle active" data-page="Color converter">Color converter</span>
                    <span class="page-toggle" data-page="Gradient picker">Gradient picker</span>
                </div>

                <div class="page-title">Color converter</div>
            </div>

            <div class="page active" data-page="Color converter">
                <div class="container">
                    <div id="app" :style="{  }">
                        <div id="swatch-container">
                            <!--           <div id="swatch" class="swatch og" :style="{ backgroundColor, borderColor }"></div>
          <div id="swatch2" class="swatch linear" :style="{ backgroundColor }"></div>
          <div id="swatch3" class="swatch visually" :style="{ backgroundColor }"></div> -->
                            <div class="swatch-wrap">
                                <div class="tooltip">Original<span class="value"></span></div>
                                <div class="swatch og" :style="{ backgroundColor: originalBG }" title="Original"></div>
                            </div>

                            <div class="swatch-wrap">
                                <div class="tooltip">Converted<span class="value"></span></div>
                                <div
                                    class="swatch normal-converted"
                                    :style="{ backgroundColor: value }"
                                    title="Converted"
                                ></div>
                            </div>

                            <div class="swatch-wrap">
                                <div class="tooltip">Linear blended<span class="value"></span></div>
                                <div
                                    class="swatch linear"
                                    :style="{ backgroundColor: linearRGB }"
                                    title="Linear blended"
                                ></div>
                            </div>

                            <div class="swatch-wrap">
                                <div class="tooltip">Visually matched<span class="value"></span></div>
                                <div
                                    class="swatch visually"
                                    :style="{ backgroundColor: visualRGB }"
                                    title="Visually matched"
                                ></div>
                            </div>

                            <!--           <form id="dark-mode-toggle">
            <input type="radio" v-model="darkMode" id="light" name="dark-mode" value="light">
            <label for="light"><span class="sr">Light mode</span></label>
            <input type="radio" v-model="darkMode" id="dark" name="dark-mode" value="dark">
            <label for="dark"><span class="sr">Dark mode</span></label>
          </form> -->
                        </div>

                        <form id="app-form" action="" :style="{ borderColor }">
                            <div id="value-wrap" class="group">
                                <div>
                                    <label for="value">Enter a color:</label>
                                    <input
                                        v-model="value"
                                        @input="validate"
                                        id="value"
                                        type="text"
                                        placeholder="Any RGB or hex value"
                                    />
                                </div>
                            </div>

                            <div class="group text-group hidden">
                                <ul>
                                    <li><strong>Format detected:</strong> {{ fromFormat }}</li>
                                    <li><strong>Converting to:</strong> {{ toFormat }}</li>
                                </ul>
                            </div>
                        </form>
                    </div>

                    <div class="result-wrapper">
                        <div class="result-group">
                            <div class="flex">
                                <label for="result">Converted value:</label>
                                <input ref="output" id="result" tabindex="-1" type="text" :value="convertedValue" />
                            </div>
                            <div class="flex">
                                <div class="toggle">
                                    <button @click.prevent="toggleColor">{{ toggleButtonText }}</button>
                                </div>

                                <button
                                    @click.prevent="copy"
                                    :disabled="!convertedValue"
                                    type="button"
                                    ref="copyButton"
                                >
                                    {{ copyButtonText }}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="page" data-page="Gradient picker">
                <div class="container">
                    <div class="inputs">
                        <input type="number" class="gradient-angle" placeholder="Angle" value="45" />
                        <input type="text" class="hex-input value-1" placeholder="Hex value 1" />
                        <input type="text" class="hex-input value-2" placeholder="Hex value 2" />
                    </div>

                    <div class="gradients"></div>

                    <div class="links">
                        <div class="title">Links</div>
                        <a href="https://oklch.com/">Color picker & converter</a>
                        <a href="https://gradient.style/">CSS HD Gradients</a>
                    </div>
                </div>
            </div>
        </main>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.0/jquery.min.js"></script>
        <script src="https://cdn.skypack.dev/tweakpane@4.0.4"></script>
		  <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/2.6.11/vue.min.js"></script>
		  <script src="https://unpkg.com/chroma-js@3.1.2/dist/chroma.min.cjs"></script>
		  
        <script type="module" src="./script.js"></script>
    </body>
</html>
