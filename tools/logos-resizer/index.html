<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Logos resizer</title>
        <link rel="stylesheet" href="https://public.codepenassets.com/css/normalize-5.0.0.min.css" />
        <link rel="stylesheet" href="./style.css" />
    </head>

    <body>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

        <div id="guide-overlay"><div class="button clear-guides hidden">Delete all guides</div></div>

<div class="topbar">
  <div class="topbar-group">
    <span class="topbar-label">W</span>
    <input type="number" id="cw" value="400" />
    <span style="color:var(--muted);font-size:13px;">×</span>
    <span class="topbar-label">H</span>
    <input type="number" id="ch" value="300" />
    <span id="apply-size" class="btn-icon" title="Apply size" style="margin-left:2px;">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"><g stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5" fill="none" stroke="#fff"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></g></svg>
    </span>
  </div>

  <div class="sep"></div>

  <div class="topbar-group">
    <span class="topbar-label">Bg</span>
    <div class="color-presets">
      <label><input type="radio" name="bg-color" value="transparent" checked /><span class="preset transparent" title="Transparent"></span></label>
      <label><input type="radio" name="bg-color" value="#ffffff" /><span class="preset white" title="White"></span></label>
      <label><input type="radio" name="bg-color" value="#000000" /><span class="preset black" title="Black"></span></label>
      <label class="custom-picker"><input type="radio" name="bg-color" value="custom" /><span class="preset picker" title="Custom"></span><input type="color" class="color-input" /></label>
    </div>
  </div>

  <div class="sep"></div>

  <div class="smoothing-row">
    <input type="checkbox" id="smoothing" class="smoothing-checkbox" checked />
    <label for="smoothing" style="font-size:13px;cursor:pointer;">Smoothing</label>
  </div>

  <div class="sep"></div>

  <div class="topbar-group dl-end">
    <span class="topbar-label">Export</span>
    <select id="exportFormat">
      <option value="original">Original type</option>
      <option value="png">PNG</option>
      <option value="jpeg">JPEG</option>
    </select>
    <span id="download-all" class="btn-icon" title="Download all">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"><g stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5" fill="none" stroke="#fff"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></g></svg>
    </span>
  </div>
</div>

<div class="content">
  <div id="grid"></div>

  <div id="dropZone">
    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24"><g stroke-linejoin="round" stroke-linecap="round" stroke-width="2" fill="none" stroke="currentColor"><path d="M12 3v12"/><path d="m17 8-5-5-5 5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></g></svg>
    <span>Drop images here or click to upload</span>
  </div>
  <input type="file" id="upload" multiple accept=".png,.jpg,.jpeg,.svg,.webp" hidden />
</div>
        <script src="./script.js"></script>
    </body>
</html>
