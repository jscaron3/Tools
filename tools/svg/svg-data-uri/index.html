<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>SVG → Data URI</title>
        <link rel="stylesheet" href="https://public.codepenassets.com/css/normalize-5.0.0.min.css" />
        <link rel="stylesheet" href="./style.css" />
    </head>

    <body>

      <!-- Based on: https://codepen.io/elliz/pen/ygvgay -->

<div class="container">

    <header>
      <h1>SVG <span>→</span> Data URI</h1>
      <p class="subtitle">Paste the source of a valid SVG document and generate a CSS <code>background-image</code> data URI that works cross-browser.</p>
      <!--<div class="demos">
        <span class="demos-label">Demos</span>
        <button class="demo-btn" id="circle">Circle</button>
        <button class="demo-btn" id="use">Symbol use</button>
        <button class="demo-btn" id="animate">Animated</button>
        <button class="demo-btn" id="trans">Transparent</button>
        <button class="demo-btn" id="fenders">Fenders</button>
        <button class="demo-btn" id="marker">Marker</button>
      </div>-->
    </header>

    <hr class="divider">

    <div class="panels">
      <div class="panel">
        <div class="panel-label">SVG source</div>
        <textarea id="input" placeholder='<svg xmlns="http://www.w3.org/2000/svg" ...>&#10;  ...&#10;</svg>'></textarea>
        <div class="toolbar">
          <button class="btn" id="convert">Convert</button>
          <div class="color-wrap">
            <label for="background-colour" style="font-size:0.8rem;color:var(--text-secondary)">Preview bg</label>
            <input type="color" value="#ffffff" id="background-colour" title="Preview background colour">
          </div>
        </div>
      </div>

      <div class="panel">

        

        <div class="panel-label">Output</div>
        <textarea id="output" placeholder="background-image: url(&quot;data:image/svg+xml;...&quot;);" readonly></textarea>
        
        <div class="modes">
          <div id="encoding-toggle">
            <label><input type="radio" name="encoding" value="uri" checked> URL-encoded</label>
            <label><input type="radio" name="encoding" value="base64"> Base64</label>
          </div>

          <div id="output-types">
            <label><input type="radio" name="output-type" value="bg-img" checked> Background-image</label>
            <label><input type="radio" name="output-type" value="url"> URL</label>
            <label><input type="radio" name="output-type" value="data"> Data</label>
            <label><input type="radio" name="output-type" value="raw"> Raw</label>
          </div>
        </div>

        <div class="toolbar">
          <button class="btn btn-ghost" id="copy" data-copy="#output" data-copy-message=".copy-ok">Copy to clipboard</button>
          <span class="copy-ok" id="copy-ok">&#10003; Copied</span>
        </div>
      </div>
    </div>

    <div class="preview-section" id="preview-section">
      <div class="preview-label">Live preview</div>
      <div id="preview-bar"></div>
    </div>

  </div>
        <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.0/jquery.min.js"></script> -->
        <script src="./script.js"></script>
    </body>
</html>
