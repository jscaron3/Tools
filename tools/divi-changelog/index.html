<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Divi Changelog Dashboard</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <header class="site-header">
    <div>
      <h1>Divi Changelog</h1>
      <p class="muted">Last synced: <span id="last-sync">Loading…</span></p>
      <p class="muted">Official changelogs:
        <a href="https://www.elegantthemes.com/api/changelog/divi.txt" target="_blank" rel="noopener">Divi 4</a> ·
        <a href="https://www.elegantthemes.com/api/changelog/divi-5.txt" target="_blank" rel="noopener">Divi 5</a>
      </p>
    </div>
    <button id="refresh" type="button" title="Reloads the saved data files from this site (does not contact Elegant Themes)">Refresh data</button>
  </header>

  <main>
    <section class="controls" aria-label="Filters">
      <div class="tabs" role="tablist">
        <button role="tab" type="button" data-product="all" aria-selected="true">Combined</button>
        <button role="tab" type="button" data-product="divi-4" aria-selected="false">Divi 4</button>
        <button role="tab" type="button" data-product="divi-5" aria-selected="false">Divi 5</button>
      </div>

      <div class="filter-row">
        <label class="grow">Search
          <input id="search" type="search" placeholder="Version or release notes">
        </label>
        <label>From <input id="from" type="date"></label>
        <label>To <input id="to" type="date"></label>
      </div>

      <fieldset class="types">
        <legend>Change types</legend>
        <label><input type="checkbox" name="type" value="feature" checked> Features</label>
        <label><input type="checkbox" name="type" value="improvement" checked> Improvements</label>
        <label><input type="checkbox" name="type" value="bug" checked> Bug fixes</label>
        <label><input type="checkbox" name="type" value="security" checked> Security</label>
        <button id="reset" type="button">Reset filters</button>
      </fieldset>
    </section>

    <p id="status" class="muted" role="status"></p>
    <ol id="releases" class="releases"></ol>
  </main>

  <script src="assets/js/app.js"></script>
</body>
</html>
